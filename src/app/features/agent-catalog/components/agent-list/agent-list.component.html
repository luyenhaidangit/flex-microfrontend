<div class="container-fluid">
  <app-page-title title="Danh mục Agent" [breadcrumbItems]="[{ label: 'Quản lý Agent' }, { label: 'Danh mục Agent', active: true }]"></app-page-title>

  <div class="bg-white rounded shadow-sm p-3">
    <div class="d-flex justify-content-end mb-3">
      <button type="button" class="btn btn-success fw-bold" (click)="openCreateModal()">
        <i class="fas fa-plus me-1"></i> Thêm Agent
      </button>
    </div>

    <div class="table-responsive table-header-primary">
      <table class="table align-middle table-nowrap dt-responsive nowrap w-100">
        <thead>
          <tr>
            <th>Tên Agent</th>
            <th>Mô tả</th>
            <th>Trạng thái</th>
            <th>Ngày tạo</th>
            <th class="action-column">Thao tác</th>
          </tr>
        </thead>
        <tbody *ngIf="isLoading">
          <tr *ngFor="let _ of [].constructor(5)">
            <td *ngFor="let __ of [].constructor(5)">
              <app-skeleton width="100%" height="18px"></app-skeleton>
            </td>
          </tr>
        </tbody>
        <tbody *ngIf="!isLoading && agents.length">
          <tr *ngFor="let agent of agents">
            <td>{{ agent.name }}</td>
            <td>{{ agent.description | safeField }}</td>
            <td><app-badge [value]="agent.status" type="status"></app-badge></td>
            <td>{{ agent.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
            <td class="action-column">
              <button class="btn btn-link p-0 text-warning" (click)="openEditModal(agent)" title="Sửa">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-link p-0 ms-2 text-danger" (click)="openDeleteModal(agent)" title="Xóa">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
        <tbody *ngIf="!isLoading && !agents.length">
          <tr>
            <td colspan="5" class="text-center text-muted py-4">Chưa có Agent nào trong danh mục.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-agent-form-modal
  [isVisible]="showFormModal"
  [agent]="selectedAgent"
  (close)="onFormModalClose()"
  (saved)="onAgentSaved()">
</app-agent-form-modal>

<app-agent-delete-confirm-modal
  [isVisible]="showDeleteModal"
  [agent]="selectedAgent"
  (close)="onDeleteModalClose()"
  (deleted)="onAgentDeleted()">
</app-agent-delete-confirm-modal>
