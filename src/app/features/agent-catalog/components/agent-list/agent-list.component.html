<div class="container-fluid">
  <app-page-title [title]="CONFIG.breadcrumb.title" [breadcrumbItems]="CONFIG.breadcrumb.items"></app-page-title>

  <div class="bg-white rounded shadow-sm p-3">
    <!-- Search bar -->
    <div class="row gx-3 mb-3 gy-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label fw-bold text-muted">Từ khóa</label>
        <input class="form-control" type="text" placeholder="Nhập từ khóa..." [(ngModel)]="searchInputValue" (keyup.enter)="onSearchClick()">
      </div>

      <div class="col-auto">
        <button class="btn btn-primary w-100" (click)="onSearchClick()">
          <i class="bx bx-search-alt-2"></i> Tìm kiếm
        </button>
      </div>

      <div class="col-auto text-md-end">
        <button type="button" class="btn btn-success fw-bold" (click)="openCreateModal()">
          <i class="fas fa-plus me-1"></i> Thêm mới
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive table-header-primary">
      <table class="table align-middle table-nowrap dt-responsive nowrap w-100">
        <thead>
          <tr>
            <th *ngFor="let col of CONFIG.table.columns" [style.width]="col.width">{{ col.label }}</th>
          </tr>
        </thead>
        <tbody *ngIf="isLoading">
          <tr *ngFor="let _ of [].constructor(CONFIG.table.skeleton.rows)">
            <td *ngFor="let w of CONFIG.table.skeleton.columns">
              <app-skeleton [width]="w" height="18px"></app-skeleton>
            </td>
          </tr>
        </tbody>
        <tbody *ngIf="!isLoading && paginatedAgents.length">
          <tr *ngFor="let agent of paginatedAgents">
            <td>{{ agent.name | safeField }}</td>
            <td>{{ agent.description | safeField }}</td>
            <td><app-badge [value]="agent.status" [customConfigs]="agentStatusConfigs"></app-badge></td>
            <td>{{ agent.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
            <td class="action-column">
              <button class="btn btn-link p-0 text-warning" (click)="openEditModal(agent)" title="Sửa">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-link p-0 ms-2 text-danger" (click)="openDeleteModal(agent)" title="Xóa">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
        <tbody *ngIf="!isLoading && !paginatedAgents.length">
          <tr>
            <td [attr.colspan]="CONFIG.table.columns.length" class="text-center text-muted">Không có dữ liệu</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <app-pagination
      [paginationState]="getPaginationState()"
      [pageSizeOptions]="CONFIG.pagination.pageSizeOptions"
      (pageChanged)="onPageChange($event)"
      (pageSizeChanged)="onPageSizeChange($event)">
    </app-pagination>
  </div>
</div>

<app-agent-form-modal
  [isVisible]="showFormModal"
  [agent]="selectedAgent"
  (close)="onFormModalClose()"
  (saved)="onAgentSaved()">
</app-agent-form-modal>

<app-agent-delete-confirm-modal
  [isVisible]="showDeleteModal"
  [agent]="selectedAgent"
  (close)="onDeleteModalClose()"
  (deleted)="onAgentDeleted()">
</app-agent-delete-confirm-modal>
