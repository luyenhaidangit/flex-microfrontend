<div [formGroup]="formGroup" class="form-pane">
  <!-- Title & Header -->
  <div class="pane-title-area mb-4">
    <h4 class="fw-bold text-dark mb-1 fs-5">Thông tin chung</h4>
    <p class="text-muted small mb-0">
      Thiết lập thông tin cơ bản và chỉ dẫn để định danh và định hình cách tương tác cho Nhân viên AI
    </p>
  </div>

  <!-- Accordion Card 1: Thông tin cơ bản -->
  <div class="card border rounded-3 mb-4 shadow-none">
    <div
      class="card-header bg-transparent py-2 px-3 fw-semibold border-bottom-0 d-flex align-items-center gap-2 cursor-pointer"
      (click)="toggleSection('basicInfo')"
    >
      <i class="bx text-secondary" [class.bx-chevron-down]="!isSectionCollapsed('basicInfo')" [class.bx-chevron-right]="isSectionCollapsed('basicInfo')"></i> Thông tin cơ bản
    </div>
    <div class="card-body pt-1 px-3 pb-3" [collapse]="isSectionCollapsed('basicInfo')">
      <!-- Avatar Picker -->
      <div class="mb-3">
        <label class="form-label small fw-medium text-secondary mb-2">Hình đại diện <span class="text-danger">*</span></label>
        <div class="d-flex align-items-center">
          <input
            #avatarInput
            type="file"
            accept="image/png,image/jpeg,image/webp"
            class="d-none"
            (change)="onAvatarChange($event)"
          />
          <button
            type="button"
            class="avatar-upload-item rounded-circle border d-flex align-items-center justify-content-center position-relative"
            [class.selected]="avatarFile"
            (click)="avatarInput.click()"
            title="Thay đổi ảnh đại diện"
            aria-label="Thay đổi ảnh đại diện"
          >
            <img
              [src]="f['avatarUrl'].value || 'assets/images/default-agent-avatar.png'"
              alt="Ảnh đại diện Agent"
              class="uploaded-avatar-preview rounded-circle"
            />
            <span class="avatar-upload-icon position-absolute d-flex align-items-center justify-content-center rounded-circle border bg-white text-primary shadow-sm small">
              <i class="bx bx-upload"></i>
            </span>
          </button>
        </div>
        <div class="form-text">PNG, JPG hoặc WebP, tối đa 2 MB.</div>
        <div *ngIf="avatarError" class="text-danger small mt-1">{{ avatarError }}</div>
      </div>

      <!-- Form Fields: Tên & Vai trò -->
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small fw-medium text-dark mb-1">Tên <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            placeholder="VD: Trợ lý tư vấn bán hàng"
            formControlName="name"
            [class.is-invalid]="f['name'].touched && f['name'].invalid"
          />
          <div *ngIf="f['name'].touched && f['name'].invalid" class="invalid-feedback small">
            Tên Agent là bắt buộc.
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-medium text-dark mb-1">Vai trò</label>
          <input
            type="text"
            class="form-control"
            placeholder="VD: Tư vấn sản phẩm và hỗ trợ khách hàng (không bắt buộc)"
            formControlName="role"
            [class.is-invalid]="f['role'].touched && f['role'].invalid"
          />
          <div *ngIf="f['role'].touched && f['role'].invalid" class="invalid-feedback small">
            Vai trò không vượt quá 500 ký tự.
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Accordion Card 2: Chỉ dẫn cho Agent -->
  <div class="card border rounded-3 mb-4 shadow-none">
    <div
      class="card-header bg-transparent py-2 px-3 fw-semibold border-bottom-0 d-flex align-items-center gap-2 cursor-pointer"
      (click)="toggleSection('instructions')"
    >
      <i class="bx text-secondary" [class.bx-chevron-down]="!isSectionCollapsed('instructions')" [class.bx-chevron-right]="isSectionCollapsed('instructions')"></i> Chỉ dẫn cho Agent
    </div>
    <div class="card-body pt-1 px-3 pb-3" [collapse]="isSectionCollapsed('instructions')">
      <div class="mb-2 d-flex align-items-center justify-content-between">
        <label class="form-label small fw-medium text-dark mb-0">
          Chỉ dẫn cho Agent <span class="text-danger">*</span>
        </label>
      </div>

      <ckeditor
        [editor]="Editor"
        [config]="editorConfig"
        formControlName="instructions"
        class="instructions-editor"
      ></ckeditor>
    </div>
  </div>
</div>
