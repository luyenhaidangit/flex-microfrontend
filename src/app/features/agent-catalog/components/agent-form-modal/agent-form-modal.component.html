<div class="modal fade show d-block" *ngIf="isVisible" tabindex="-1" role="dialog" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-semibold" [ngClass]="isEditMode ? 'text-warning' : 'text-success'">
          <i class="fas fa-robot me-2"></i>{{ isEditMode ? 'Sửa Agent' : 'Thêm Agent mới' }}
        </h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="onCancel()"></button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="modal-body px-4 py-3">
          <div class="mb-3 position-relative">
            <label class="form-label">Tên Agent <span class="text-danger">*</span></label>
            <input
              type="text"
              class="form-control"
              formControlName="name"
              placeholder="Nhập tên Agent"
              maxlength="100"
              [ngClass]="{ 'is-invalid': isFieldInvalid('name') }" />
            <div *ngIf="isFieldInvalid('name')" class="invalid-tooltip">{{ getFieldError('name') }}</div>
          </div>

          <div class="mb-3 position-relative">
            <label class="form-label">Mô tả</label>
            <textarea
              class="form-control"
              rows="3"
              formControlName="description"
              placeholder="Mô tả (không bắt buộc)"
              maxlength="500"
              [ngClass]="{ 'is-invalid': isFieldInvalid('description') }"></textarea>
            <div *ngIf="isFieldInvalid('description')" class="invalid-tooltip">{{ getFieldError('description') }}</div>
          </div>
        </div>

        <div class="modal-footer border-top-0">
          <button type="button" class="btn btn-outline-secondary me-2" (click)="onCancel()" [disabled]="isSubmitting">
            Hủy
          </button>
          <button type="submit" [ngClass]="isEditMode ? 'btn btn-warning' : 'btn btn-success'" [disabled]="isSubmitting || form.invalid">
            <i class="fas fa-save me-1" *ngIf="!isSubmitting"></i>
            <span class="spinner-border spinner-border-sm me-1" *ngIf="isSubmitting" role="status" aria-hidden="true"></span>
            {{ isSubmitting ? 'Đang lưu...' : (isEditMode ? 'Cập nhật' : 'Tạo mới') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
